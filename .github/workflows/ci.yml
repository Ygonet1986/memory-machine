name: CI

# Deterministic, required-quality workflow: no secrets, no network model calls.
# Everything here can run on a fork PR. The scientific evaluation lives in
# scientific.yml and is intentionally non-blocking.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported (3.11) + latest stable (bump when a new stable lands).
        python: ["3.11", "3.14"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Full test suite
        run: python -m pytest -q

      - name: Anti-disappearance (conformance proof manifest)
        run: python scripts/verify_proof_manifest.py

      - name: Installed smoke (wheel -> clean venv -> CLI)
        run: python scripts/smoke_installed.py

      - name: Offline harness checks (deterministic)
        run: |
          python eval/evidence_cards.py --report --fixture eval/fixtures/composition_u4 --out eval/results/e0_ci
          python eval/composition_e5.py --dry-run --out eval/results/e5_ci
          python eval/trilepsia_gate.py --dry-run --fixture eval/fixtures/trilepsia_gate_v1 --out eval/results/gate_ci

      - name: Build wheel
        run: pip wheel --no-deps -w dist .

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload conformance proof
        uses: actions/upload-artifact@v4
        with:
          name: conformance-proof-${{ matrix.os }}-py${{ matrix.python }}
          path: docs/CONFORMANCE_PROOF.txt
